name: Weather analysis checks

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas matplotlib pytest requests
      - name: Compile project and tests
        run: python -m compileall -q weather-Data-Analysis.py scripts tests
      - name: Run dataset and execution tests
        run: pytest -q
